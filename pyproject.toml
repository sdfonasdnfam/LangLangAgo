[project]
name = "LangLangAgo"
version = "0.1.0"
description = "LangGraph + Playwright MCP browser agent with simple skills"
requires-python = ">=3.11"
dependencies = [
  "langchain-mcp-adapters>=0.2,<0.3",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "mcp>=1.20,<2",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6,<7",
  "streamlit>=1.45,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
